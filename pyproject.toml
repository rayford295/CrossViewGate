[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossview-gate"
version = "0.1.0"
description = "Cross-view complementarity in disaster damage assessment: conflict cases, a visibility-conditioned fusion gate, and label-free conflict-density maps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pillow",
  "torch",
  "torchvision",
  "transformers",
  "tqdm",
]

[project.optional-dependencies]
analysis = [
  "matplotlib",
  "seaborn",
]

[tool.setuptools.packages.find]
include = ["crossview_conflict*"]
